name: tests

# Runs on every push and pull request so a broken change cannot reach main
# unnoticed. The project has no third-party dependencies, so the only thing the
# runner needs beyond Python is ngspice (the open-source simulator the
# simulator tests exercise).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the version the bridge was developed against; 3.12 guards
        # against newer-interpreter regressions.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ngspice (used by the simulator tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ngspice
          ngspice -v | head -2

      - name: Byte-compile every module
        run: python -m compileall -q pyaether_bridge tests

      - name: CLI smoke test (no daemon, no Docker)
        run: bash tests/smoke_cli.sh

      - name: MCP protocol probe
        run: python tests/mcp_probe.py

      - name: Transport probe (local + stubbed ssh)
        run: python tests/transport_probe.py

      - name: Simulator probe (real ngspice run against theory)
        run: python tests/simulator_probe.py

      - name: Guard against committing generated catalogs
        # data/catalog.sqlite is derived from vendor documentation; shipping it
        # would redistribute vendor material. It must stay out of the repo.
        run: |
          if git ls-files | grep -E '\.(sqlite|sqlite3)$'; then
            echo "::error::Generated catalog databases must not be committed."
            exit 1
          fi
          echo "no catalog database is tracked"
